# =========================================================
# Argo Mon StatusEndpoint API - Configuration
# =========================================================

# ---------------------------------------------------------
# Quarkus General
# ---------------------------------------------------------
quarkus.hibernate-orm.mapping.format.global=ignore

# ---------------------------------------------------------
# OpenID Connect (OIDC / Keycloak)
# ---------------------------------------------------------

# Quarkus spins up its own Keycloak
quarkus.oidc.client-id=backend-service
quarkus.oidc.credentials.secret=secret
quarkus.oidc.authorization-path=/protocol/openid-connect/auth
quarkus.oidc.token-path=/protocol/openid-connect/token
quarkus.oidc.discovery-enabled=false
quarkus.oidc.introspection-path=/protocol/openid-connect/token/introspect
%prod.quarkus.oidc.user-info-path=/protocol/openid-connect/userinfo
%prod.quarkus.oidc.authentication.user-info-required=true

# Optional for quick local development without OIDC
# %dev.quarkus.oidc.enabled=false

# ---------------------------------------------------------
# Keycloak Dev Services
# ---------------------------------------------------------
quarkus.keycloak.devservices.enabled=true
quarkus.keycloak.devservices.realm-path=quarkus-realm.json
quarkus.keycloak.devservices.port=58080

# ---------------------------------------------------------
# Custom claim for unique user ID
# ---------------------------------------------------------
api.oidc.user.unique.id=voperson_id

# ---------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------
quarkus.smallrye-openapi.path=/open-api
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

quarkus.smallrye-openapi.info-title=Argo Mon Status API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Status pages for the Argo Mon Web API Reports
quarkus.smallrye-openapi.info-contact-name=GRNET eINFRA Development Team
quarkus.smallrye-openapi.info-contact-url=https://status.devel.mon.argo.grnet.gr/
quarkus.smallrye-openapi.info-license-name=Apache 2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0.html

# ---------------------------------------------------------
# HTTP and CORS
# ---------------------------------------------------------
quarkus.http.cors=true
quarkus.http.port=8080
%dev.quarkus.http.cors.origins=/.*/
quarkus.http.cors.origins=https://status.devel.mon.argo.grnet.gr/,https://api.status.devel.mon.argo.grnet.gr/

# ---------------------------------------------------------
# Health & Base URLs
# ---------------------------------------------------------
quarkus.smallrye-health.root-path=/q/health
api.server.url=${API_SERVER_URL:http://localhost:8080}
api.ui.url=http://localhost:5173
api.name=argo-mon-status-api

# ---------------------------------------------------------
# HTML / OIDC UI Integration (Qute template)
# ---------------------------------------------------------
# keycloak properties for feeding the oidc_client html template
api.html.keycloak.url=http://localhost:58080
api.html.keycloak.realm=quarkus
api.html.keycloak.public.client.id=frontend-service
api.html.keycloak.javascript.adapter=/js/keycloak.min.js
api.html.oidc.client.url=http://localhost:8080/oidc-client
api.html.swagger.documentation=http://localhost:8080/swagger-ui


# ---------------------------------------------------------
# Keycloak Group Management (Auth Library Integration)
# ---------------------------------------------------------
# REST clients for AAI Group Management
quarkus.rest-client.keycloak-group-client.url=https://login-devel.einfra.grnet.gr/auth/realms/einfra/
quarkus.rest-client.keycloak-group-client.scope=jakarta.inject.Singleton

quarkus.rest-client.keycloak-token-client.url=https://login-devel.einfra.grnet.gr/auth/realms/einfra
quarkus.rest-client.keycloak-token-client.scope=jakarta.inject.Singleton

# Service account (client_credentials) used for group creation
auth.group.management.client-id=status.page.manage.groups
auth.group.management.client-secret=AUTH_AGM_CLIENT_SECRET

# Keycloak User Entitlements
api.auth.entitlements.parent.group=status-pages
api.auth.entitlements.namespace=urn:mace:grnet.gr:einfra:login-devel



# ---------------------------------------------------------
# Secrets Keys and Tokens
# ---------------------------------------------------------
api.status.encrypt.secret=U2secret234567890123456
quarkus.datasource.db-version=11.16.0

# =========================================================
# File Uploads and Static Resources
# =========================================================
%dev.base.upload.logo.dir=${user.dir}/api/uploads/logos
%test.base.upload.logo.dir=${user.dir}/api/target/test-uploads/logos
%prod.base.upload.logo.dir=/opt/status-api/uploads/logos

