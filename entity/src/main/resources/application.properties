# ---------------------------------------------------------
# Datasource production configuration
# ---------------------------------------------------------
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=root
%prod.quarkus.datasource.password=secret
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/status

# ---------------------------------------------------------
# Datasource development configuration
# ---------------------------------------------------------
dev.quarkus.datasource.devservices.port=0
%dev.quarkus.datasource.devservices.db-name=status
%dev.quarkus.datasource.devservices.username=status
%dev.quarkus.datasource.devservices.password=status
%dev.quarkus.hibernate-orm.log.sql=true

%dev.quarkus.datasource.devservices.volumes."status-data"=/var/lib/postgresql/data

# ---------------------------------------------------------
# Flyway
# ---------------------------------------------------------

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1.0
%dev.quarkus.flyway.locations=db/migration,db/development
%dev.quarkus.flyway.out-of-order=true